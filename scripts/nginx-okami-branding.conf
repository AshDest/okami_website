# ============================================================
# Nginx Configuration — OKAMI Sarl Branding Site
# Domain: okamisarl.org / www.okamisarl.org
# Root:   /var/www/okami_branding/public
# PHP:    8.2-fpm (unix socket)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name okamisarl.org www.okamisarl.org;

    # Redirect all HTTP to HTTPS (Certbot will handle this after SSL setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name okamisarl.org www.okamisarl.org;

    root /var/www/okami_branding/public;
    index index.php index.html;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/okamisarl.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/okamisarl.org/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size
    client_max_body_size 50M;

    # ─── Gzip Compression ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/opentype
        application/vnd.ms-fontobject;

    # ─── Security Headers ───────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Static Assets Caching ──────────────────────────────
    location ~* \.(css|js|ico|gif|jpeg|jpg|png|webp|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── Vite build assets (hashed filenames = long cache) ──
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── Laravel Routing ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # ─── Deny dotfiles (except .well-known for Certbot) ─────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ─── Logs ───────────────────────────────────────────────
    access_log /var/log/nginx/okami_branding_access.log;
    error_log  /var/log/nginx/okami_branding_error.log;
}


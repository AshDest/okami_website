name: 🌐 Deploy Branding Site

on:
  push:
    branches: [branding]

jobs:
  deploy:
    name: 🚀 Deploy Branding to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          debug: true
          script_stop: true
          script: |
            set -e

            APP_DIR="/var/www/okami_branding"
            REPO_URL="https://github.com/AshDest/okami_website.git"
            BRANCH="branding"

            echo "📂 Checking project directory..."
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "⚠️  Not a git repo. Re-cloning..."
              sudo rm -rf "$APP_DIR"
              sudo mkdir -p "$APP_DIR"
              sudo chown deploy:deploy "$APP_DIR"
              git clone -b "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "📥 Pulling latest code from branding branch..."
            git fetch origin branding
            git reset --hard origin/branding

            # Setup .env if missing (fresh clone) — before composer so .env exists
            NEEDS_KEY=false
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env from .env.example..."
              cp .env.example .env
              NEEDS_KEY=true
            fi

            # Create SQLite database if missing
            if [ ! -f database/database.sqlite ]; then
              echo "🗃️ Creating SQLite database..."
              touch database/database.sqlite
            fi

            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Generate app key after composer install (needs vendor/autoload.php)
            if [ "$NEEDS_KEY" = true ]; then
              echo "🔑 Generating application key..."
              php artisan key:generate --force
            fi

            echo "📦 Installing Node.js dependencies..."
            npm ci

            echo "🔨 Building frontend assets..."
            npm run build

            echo "⚙️ Caching Laravel configuration..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🗃️ Running database migrations..."
            php artisan migrate --force

            # Create storage link if missing
            if [ ! -L public/storage ]; then
              php artisan storage:link
            fi

            echo "🔑 Fixing permissions..."
            sudo chown -R www-data:www-data /var/www/okami_branding/storage
            sudo chown -R www-data:www-data /var/www/okami_branding/bootstrap/cache
            sudo chmod -R 775 /var/www/okami_branding/storage
            sudo chmod -R 775 /var/www/okami_branding/bootstrap/cache

            echo "🔄 Reloading services..."
            sudo systemctl reload php8.2-fpm
            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully!"


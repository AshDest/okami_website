name: 🌐 Deploy Branding Site

on:
  push:
    branches: [branding]

jobs:
  deploy:
    name: 🚀 Deploy Branding to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/var/www/okami_branding"
            REPO="https://github.com/AshDest/okami_website.git"
            BRANCH="branding"

            # ─── First deploy: clone if directory doesn't exist ───
            if [ ! -d "$APP_DIR" ]; then
              echo "📂 First deployment — cloning repository..."
              sudo mkdir -p "$APP_DIR"
              sudo chown deploy:deploy "$APP_DIR"
              git clone -b "$BRANCH" "$REPO" "$APP_DIR"
              cd "$APP_DIR"

              echo "⚙️ Setting up .env..."
              cp .env.example .env
              php artisan key:generate

              echo "🗃️ Creating SQLite database..."
              touch database/database.sqlite

              echo "🔗 Creating storage link..."
              php artisan storage:link
            else
              echo "📂 Navigating to project directory..."
              cd "$APP_DIR"

              echo "📥 Pulling latest code from $BRANCH branch..."
              git fetch origin "$BRANCH"
              git reset --hard origin/"$BRANCH"
            fi

            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "📦 Installing Node.js dependencies..."
            npm ci

            echo "🔨 Building frontend assets..."
            npm run build

            echo "⚙️ Caching Laravel configuration..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🗃️ Running database migrations..."
            php artisan migrate --force

            echo "🔑 Fixing permissions..."
            sudo chown -R www-data:www-data "$APP_DIR/storage"
            sudo chown -R www-data:www-data "$APP_DIR/bootstrap/cache"
            sudo chmod -R 775 "$APP_DIR/storage"
            sudo chmod -R 775 "$APP_DIR/bootstrap/cache"

            echo "🔄 Reloading services..."
            sudo systemctl reload php8.2-fpm
            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully!"

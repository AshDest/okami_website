name: 🌐 Deploy Branding Site

on:
  push:
    branches: [branding]

jobs:
  deploy:
    name: 🚀 Deploy Branding to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          debug: true
          script_stop: true
          script: |
            set -e

            echo "📂 Navigating to project directory..."
            cd /var/www/okami_branding

            echo "📥 Pulling latest code from branding branch..."
            git fetch origin branding
            git reset --hard origin/branding

            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "📦 Installing Node.js dependencies..."
            npm ci

            echo "🔨 Building frontend assets..."
            npm run build

            echo "⚙️ Caching Laravel configuration..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🗃️ Running database migrations..."
            php artisan migrate --force

            echo "🔑 Fixing permissions..."
            sudo chown -R www-data:www-data /var/www/okami_branding/storage
            sudo chown -R www-data:www-data /var/www/okami_branding/bootstrap/cache
            sudo chmod -R 775 /var/www/okami_branding/storage
            sudo chmod -R 775 /var/www/okami_branding/bootstrap/cache

            echo "🔄 Reloading services..."
            sudo systemctl reload php8.2-fpm
            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully!"


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="skin5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A0663C"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
  </defs>
  <rect width="600" height="450" rx="24" fill="url(#bg5)"/>

  <!-- Water puddle -->
  <ellipse cx="320" cy="400" rx="220" ry="35" fill="#93c5fd" opacity="0.3"/>

  <!-- Tricycle being washed -->
  <g transform="translate(230, 220)">
    <rect width="180" height="85" rx="14" fill="#4f46e5" opacity="0.75"/>
    <rect x="10" y="12" width="90" height="58" rx="10" fill="#6366f1"/>
    <rect x="110" y="0" width="70" height="85" rx="8" fill="#3730a3"/>
    <rect x="118" y="15" width="54" height="40" rx="6" fill="#a5b4fc" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="50" cy="95" r="30" fill="#1e293b"/><circle cx="50" cy="95" r="16" fill="#475569"/><circle cx="50" cy="95" r="5" fill="#334155"/>
    <circle cx="150" cy="95" r="30" fill="#1e293b"/><circle cx="150" cy="95" r="16" fill="#475569"/><circle cx="150" cy="95" r="5" fill="#334155"/>
  </g>

  <!-- Water drops -->
  <ellipse cx="260" cy="190" rx="7" ry="12" fill="#60a5fa" opacity="0.6"/>
  <ellipse cx="310" cy="170" rx="6" ry="10" fill="#60a5fa" opacity="0.5"/>
  <ellipse cx="360" cy="185" rx="7" ry="12" fill="#60a5fa" opacity="0.6"/>
  <ellipse cx="400" cy="165" rx="5" ry="9" fill="#60a5fa" opacity="0.4"/>
  <ellipse cx="340" cy="155" rx="6" ry="10" fill="#60a5fa" opacity="0.5"/>

  <!-- Soap bubbles -->
  <circle cx="200" cy="230" r="16" fill="none" stroke="#93c5fd" stroke-width="2.5" opacity="0.6"/>
  <circle cx="180" cy="260" r="10" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
  <circle cx="445" cy="210" r="18" fill="none" stroke="#93c5fd" stroke-width="2.5" opacity="0.5"/>
  <circle cx="460" cy="250" r="11" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.4"/>
  <circle cx="220" cy="195" r="8" fill="none" stroke="#bfdbfe" stroke-width="2" opacity="0.5"/>

  <!-- Sparkles -->
  <path d="M160 100 L167 120 L187 120 L171 132 L177 152 L160 140 L143 152 L149 132 L133 120 L153 120Z" fill="#f59e0b"/>
  <path d="M470 85 L474 97 L487 97 L477 105 L480 117 L470 110 L460 117 L463 105 L453 97 L466 97Z" fill="#f59e0b" opacity="0.6"/>
  <path d="M520 155 L523 163 L531 163 L525 168 L527 176 L520 172 L513 176 L515 168 L509 163 L517 163Z" fill="#f59e0b" opacity="0.4"/>

  <!-- Person washing (Black) -->
  <g transform="translate(110, 160)">
    <circle cx="0" cy="0" r="32" fill="url(#skin5)"/>
    <path d="M-27 -12 Q-16 -40 0 -42 Q16 -40 27 -12" fill="#2C1006"/>
    <ellipse cx="-10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <ellipse cx="10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <circle cx="-9" cy="-1.5" r="1.6" fill="#fff"/>
    <circle cx="11" cy="-1.5" r="1.6" fill="#fff"/>
    <path d="M-8 15 Q0 22 8 15" stroke="#2C1006" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Body (green apron) -->
    <rect x="-24" y="34" width="48" height="65" rx="12" fill="#22c55e"/>
    <rect x="-6" y="34" width="12" height="65" fill="#16a34a"/>
    <!-- Arm holding hose -->
    <path d="M24 50 Q55 38 75 20" stroke="url(#skin5)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Other arm -->
    <path d="M-24 50 Q-45 65 -42 90" stroke="url(#skin5)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="-16" y="96" width="12" height="48" rx="5" fill="#1e293b"/>
    <rect x="4" y="96" width="12" height="48" rx="5" fill="#1e293b"/>
  </g>

  <!-- Hose -->
  <path d="M185 180 Q195 165 205 155" stroke="#64748b" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Water spray -->
  <path d="M205 155 Q250 120 300 160" stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M205 155 Q260 110 320 145" stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M205 155 Q235 135 275 160" stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Revenue split card -->
  <g transform="translate(420, 350)">
    <rect width="150" height="65" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="15" y="12" width="35" height="18" rx="5" fill="#4f46e5"/>
    <text x="32" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="sans-serif">20%</text>
    <rect x="58" y="12" width="35" height="18" rx="5" fill="#22c55e"/>
    <text x="75" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="sans-serif">80%</text>
    <text x="75" y="50" text-anchor="middle" font-size="10" fill="#64748b" font-family="sans-serif">Partage revenus</text>
  </g>
</svg>


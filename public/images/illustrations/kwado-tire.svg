<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <rect width="500" height="400" rx="20" fill="#eef2ff"/>
  <!-- Tire / Wheel big -->
  <circle cx="250" cy="200" r="100" fill="#1e293b"/>
  <circle cx="250" cy="200" r="75" fill="#334155"/>
  <circle cx="250" cy="200" r="40" fill="#475569"/>
  <circle cx="250" cy="200" r="15" fill="#1e293b"/>
  <!-- Tire treads -->
  <line x1="250" y1="100" x2="250" y2="130" stroke="#1e293b" stroke-width="6"/>
  <line x1="250" y1="270" x2="250" y2="300" stroke="#1e293b" stroke-width="6"/>
  <line x1="150" y1="200" x2="180" y2="200" stroke="#1e293b" stroke-width="6"/>
  <line x1="320" y1="200" x2="350" y2="200" stroke="#1e293b" stroke-width="6"/>
  <line x1="180" y1="130" x2="200" y2="150" stroke="#1e293b" stroke-width="5"/>
  <line x1="300" y1="250" x2="320" y2="270" stroke="#1e293b" stroke-width="5"/>
  <line x1="300" y1="130" x2="320" y2="150" stroke="#1e293b" stroke-width="5"/>
  <line x1="180" y1="270" x2="200" y2="250" stroke="#1e293b" stroke-width="5"/>
  <!-- Wrench tool -->
  <rect x="60" y="120" width="15" height="120" rx="4" fill="#94a3b8"/>
  <circle cx="67" cy="115" r="18" fill="none" stroke="#94a3b8" stroke-width="10"/>
  <path d="M55 115 L80 115" stroke="#eef2ff" stroke-width="8"/>
  <!-- Person repairing (Black) -->
  <circle cx="400" cy="150" r="25" fill="#6B3F2A"/>
  <path d="M400 128 Q383 123 385 148" stroke="#3D2314" stroke-width="3" fill="none"/>
  <path d="M400 128 Q417 123 415 148" stroke="#3D2314" stroke-width="3" fill="none"/>
  <ellipse cx="393" cy="148" rx="2.5" ry="2.5" fill="#1e293b"/>
  <ellipse cx="407" cy="148" rx="2.5" ry="2.5" fill="#1e293b"/>
  <path d="M395 160 Q400 165 405 160" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Body -->
  <rect x="382" y="175" width="36" height="55" rx="10" fill="#f59e0b"/>
  <!-- Arms working -->
  <path d="M382 190 Q360 200 350 200" stroke="#6B3F2A" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M418 190 Q440 210 430 240" stroke="#6B3F2A" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="388" y="228" width="10" height="40" rx="4" fill="#1e293b"/>
  <rect x="404" y="228" width="10" height="40" rx="4" fill="#1e293b"/>
  <!-- KWADO label -->
  <rect x="60" y="310" width="130" height="40" rx="10" fill="#4f46e5"/>
  <text x="125" y="335" text-anchor="middle" font-size="16" fill="#fff" font-family="Arial" font-weight="bold">KWADO</text>
  <!-- Small gears -->
  <circle cx="420" cy="300" r="15" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="420" cy="300" r="5" fill="#94a3b8"/>
  <circle cx="440" cy="318" r="10" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="440" cy="318" r="4" fill="#94a3b8"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="skin6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A0663C"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
  </defs>
  <rect width="600" height="450" rx="24" fill="url(#bg6)"/>
  <circle cx="500" cy="380" r="70" fill="#fde68a" opacity="0.2"/>

  <!-- Big Tire -->
  <g transform="translate(300, 225)">
    <circle r="120" fill="#1e293b"/>
    <circle r="92" fill="#334155"/>
    <!-- Tire treads -->
    <line x1="0" y1="-120" x2="0" y2="-92" stroke="#1e293b" stroke-width="8"/>
    <line x1="0" y1="92" x2="0" y2="120" stroke="#1e293b" stroke-width="8"/>
    <line x1="-120" y1="0" x2="-92" y2="0" stroke="#1e293b" stroke-width="8"/>
    <line x1="92" y1="0" x2="120" y2="0" stroke="#1e293b" stroke-width="8"/>
    <line x1="-85" y1="-85" x2="-65" y2="-65" stroke="#1e293b" stroke-width="7"/>
    <line x1="65" y1="65" x2="85" y2="85" stroke="#1e293b" stroke-width="7"/>
    <line x1="65" y1="-65" x2="85" y2="-85" stroke="#1e293b" stroke-width="7"/>
    <line x1="-85" y1="85" x2="-65" y2="65" stroke="#1e293b" stroke-width="7"/>
    <!-- Hub -->
    <circle r="48" fill="#475569"/>
    <circle r="18" fill="#1e293b"/>
    <!-- Hub bolts -->
    <circle cx="0" cy="-32" r="5" fill="#64748b"/>
    <circle cx="28" cy="16" r="5" fill="#64748b"/>
    <circle cx="-28" cy="16" r="5" fill="#64748b"/>
  </g>

  <!-- Wrench tool -->
  <g transform="translate(70, 110)">
    <rect x="5" y="30" width="18" height="140" rx="6" fill="#94a3b8"/>
    <circle cx="14" cy="22" r="22" fill="none" stroke="#94a3b8" stroke-width="12"/>
    <rect x="0" y="12" width="28" height="20" rx="0" fill="url(#bg6)"/>
  </g>

  <!-- Mechanic person (Black) -->
  <g transform="translate(490, 130)">
    <circle cx="0" cy="0" r="32" fill="url(#skin6)"/>
    <path d="M-27 -12 Q-16 -40 0 -42 Q16 -40 27 -12" fill="#2C1006"/>
    <ellipse cx="-10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <ellipse cx="10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <circle cx="-9" cy="-1.5" r="1.6" fill="#fff"/>
    <circle cx="11" cy="-1.5" r="1.6" fill="#fff"/>
    <path d="M-8 15 Q0 22 8 15" stroke="#2C1006" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Body (orange work shirt) -->
    <rect x="-24" y="34" width="48" height="65" rx="12" fill="#f59e0b"/>
    <!-- Arms working -->
    <path d="M-24 50 Q-55 60 -62 80" stroke="url(#skin6)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M24 50 Q50 65 45 95" stroke="url(#skin6)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="-16" y="96" width="12" height="50" rx="5" fill="#1e293b"/>
    <rect x="4" y="96" width="12" height="50" rx="5" fill="#1e293b"/>
  </g>

  <!-- QUADO label -->
  <g transform="translate(60, 360)">
    <rect width="160" height="55" rx="14" fill="#145d28"/>
    <text x="80" y="28" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" font-family="sans-serif">QUADO</text>
    <text x="80" y="46" text-anchor="middle" font-size="10" fill="#c7d2fe" font-family="sans-serif">Service Pneumatique</text>
  </g>

  <!-- Small gears -->
  <g transform="translate(520, 320)">
    <circle r="20" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <circle r="7" fill="#94a3b8"/>
    <circle cx="25" cy="22" r="14" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="25" cy="22" r="5" fill="#94a3b8"/>
  </g>

  <!-- Small tool icon -->
  <g transform="translate(68, 60)">
    <rect width="50" height="50" rx="12" fill="#4f46e5" opacity="0.1"/>
    <path d="M15 35 L35 15" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35" cy="15" r="8" fill="none" stroke="#4f46e5" stroke-width="3"/>
  </g>
</svg>


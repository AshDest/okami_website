  <path d="M280 190 L340 190 L340 270 L280 270 Z" fill="#3730a3"/>
  <rect x="290" y="205" width="35" height="35" rx="5" fill="#a5b4fc" opacity="0.6"/>
  <!-- Wheels -->
  <circle cx="200" cy="280" r="30" fill="#1e293b"/>
  <circle cx="200" cy="280" r="15" fill="#64748b"/>
  <circle cx="200" cy="280" r="5" fill="#1e293b"/>
  <circle cx="320" cy="280" r="30" fill="#1e293b"/>
  <circle cx="320" cy="280" r="15" fill="#64748b"/>
  <circle cx="320" cy="280" r="5" fill="#1e293b"/>

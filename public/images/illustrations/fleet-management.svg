  <circle cx="117" cy="125" r="8" fill="#22c55e"/>
  <path d="M112 125 L115 128 L122 121" stroke="#fff" stroke-width="2" fill="none"/>
  <!-- Stars / Quality markers -->
  <polygon points="400,100 404,112 417,112 407,120 410,132 400,125 390,132 393,120 383,112 396,112" fill="#f59e0b"/>
  <polygon points="420,140 423,148 432,148 425,153 427,161 420,156 413,161 415,153 408,148 417,148" fill="#f59e0b" opacity="0.6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Background -->
  <rect width="500" height="400" rx="20" fill="#eef2ff"/>
  <!-- Road -->
  <rect x="50" y="280" width="400" height="40" rx="5" fill="#94a3b8"/>
  <rect x="130" y="296" width="40" height="8" rx="2" fill="#fff"/>
  <rect x="230" y="296" width="40" height="8" rx="2" fill="#fff"/>
  <rect x="330" y="296" width="40" height="8" rx="2" fill="#fff"/>
  <!-- Tricycle Body -->
  <rect x="160" y="190" width="180" height="80" rx="12" fill="#4f46e5"/>
  <rect x="170" y="200" width="100" height="60" rx="8" fill="#6366f1"/>

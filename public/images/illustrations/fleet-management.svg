  <rect x="90" y="120" width="55" height="70" rx="5" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="100" y="135" width="35" height="4" rx="2" fill="#4f46e5"/>
  <rect x="100" y="145" width="28" height="4" rx="2" fill="#a5b4fc"/>
  <rect x="100" y="155" width="32" height="4" rx="2" fill="#a5b4fc"/>
  <rect x="100" y="165" width="20" height="4" rx="2" fill="#a5b4fc"/>

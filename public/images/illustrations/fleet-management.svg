<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A0663C"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
  </defs>
  <rect width="600" height="450" rx="24" fill="url(#bg1)"/>
  <!-- Decorative blobs -->
  <circle cx="520" cy="70" r="80" fill="#c7d2fe" opacity="0.25"/>
  <circle cx="60" cy="400" r="50" fill="#ddd6fe" opacity="0.2"/>

  <!-- Road -->
  <rect y="350" width="600" height="100" fill="#94a3b8" rx="0"/>
  <rect x="70" y="395" width="55" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="195" y="395" width="55" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="320" y="395" width="55" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="445" y="395" width="55" height="10" rx="5" fill="#e2e8f0"/>

  <!-- Big Tricycle -->
  <rect x="120" y="235" width="200" height="100" rx="16" fill="#4f46e5"/>
  <rect x="135" y="250" width="100" height="72" rx="12" fill="#6366f1"/>
  <path d="M243 235 L320 235 L320 335 L243 335Z" fill="#3730a3" rx="8"/>
  <rect x="255" y="255" width="50" height="45" rx="8" fill="#a5b4fc" opacity="0.45"/>
  <!-- Wheels -->
  <circle cx="175" cy="350" r="36" fill="#1e293b"/><circle cx="175" cy="350" r="20" fill="#475569"/><circle cx="175" cy="350" r="7" fill="#1e293b"/>
  <circle cx="285" cy="350" r="36" fill="#1e293b"/><circle cx="285" cy="350" r="20" fill="#475569"/><circle cx="285" cy="350" r="7" fill="#1e293b"/>

  <!-- Driver (Black person) -->
  <circle cx="280" cy="195" r="32" fill="url(#skin1)"/>
  <path d="M250 182 Q260 158 280 155 Q300 158 310 182" fill="#2C1006"/>
  <ellipse cx="269" cy="197" rx="4" ry="4.5" fill="#1e293b"/>
  <ellipse cx="291" cy="197" rx="4" ry="4.5" fill="#1e293b"/>
  <circle cx="270" cy="195.5" r="1.5" fill="#fff"/>
  <circle cx="292" cy="195.5" r="1.5" fill="#fff"/>
  <ellipse cx="280" cy="205" rx="5" ry="3.5" fill="#7A3B10" opacity="0.4"/>
  <path d="M270 213 Q280 222 290 213" stroke="#2C1006" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="262" y="227" width="36" height="8" rx="4" fill="#f59e0b"/>

  <!-- Document Card -->
  <g transform="translate(400, 55)">
    <rect width="140" height="175" rx="14" fill="#fff" stroke="#4f46e5" stroke-width="2.5"/>
    <rect x="15" y="18" width="110" height="18" rx="6" fill="#4f46e5"/>
    <rect x="15" y="50" width="95" height="8" rx="4" fill="#c7d2fe"/>
    <rect x="15" y="68" width="75" height="8" rx="4" fill="#c7d2fe"/>
    <rect x="15" y="86" width="85" height="8" rx="4" fill="#c7d2fe"/>
    <rect x="15" y="104" width="60" height="8" rx="4" fill="#c7d2fe"/>
    <!-- Big check -->
    <circle cx="70" cy="145" r="20" fill="#22c55e"/>
    <path d="M59 145 L66 152 L82 136" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small tricycle in background -->
  <g opacity="0.5">
    <rect x="410" y="290" width="130" height="55" rx="10" fill="#7c3aed"/>
    <circle cx="440" cy="350" r="24" fill="#1e293b"/><circle cx="440" cy="350" r="13" fill="#475569"/>
    <circle cx="510" cy="350" r="24" fill="#1e293b"/><circle cx="510" cy="350" r="13" fill="#475569"/>
  </g>

  <!-- Star -->
  <path d="M75 75 L82 97 L105 97 L87 111 L93 133 L75 119 L57 133 L63 111 L45 97 L68 97Z" fill="#f59e0b"/>
  <!-- Counter bubble -->
  <circle cx="80" cy="210" r="35" fill="#4f46e5"/>
  <text x="80" y="204" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="sans-serif">200</text>
  <text x="80" y="222" text-anchor="middle" font-size="10" fill="#c7d2fe" font-family="sans-serif">motos</text>
</svg>


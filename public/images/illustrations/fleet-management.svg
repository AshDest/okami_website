  <circle cx="310" cy="165" r="22" fill="#8B5E3C"/>
  <circle cx="310" cy="165" r="22" fill="#6B3F2A"/>
  <path d="M310 145 Q295 140 295 155" stroke="#3D2314" stroke-width="3" fill="none"/>
  <path d="M310 145 Q325 140 325 155" stroke="#3D2314" stroke-width="3" fill="none"/>
  <ellipse cx="303" cy="163" rx="2" ry="2.5" fill="#1e293b"/>
  <ellipse cx="317" cy="163" rx="2" ry="2.5" fill="#1e293b"/>
  <path d="M305 172 Q310 177 315 172" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Driver body -->
  <rect x="296" y="187" width="28" height="35" rx="8" fill="#f59e0b"/>
  <rect x="292" y="187" width="8" height="25" rx="4" fill="#f59e0b"/>
  <rect x="328" y="187" width="8" height="25" rx="4" fill="#f59e0b"/>

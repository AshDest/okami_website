<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <rect width="500" height="400" rx="20" fill="#eef2ff"/>
  <!-- Warning triangle background -->
  <path d="M250 50 L420 330 L80 330 Z" fill="#fef3c7" opacity="0.5"/>
  <path d="M250 80 L390 310 L110 310 Z" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- Exclamation mark -->
  <rect x="244" y="140" width="12" height="80" rx="6" fill="#f59e0b"/>
  <circle cx="250" cy="245" r="8" fill="#f59e0b"/>
  <!-- Damaged tricycle -->
  <rect x="160" y="260" width="100" height="40" rx="6" fill="#6366f1" opacity="0.6"/>
  <rect x="170" y="265" width="40" height="28" rx="4" fill="#818cf8"/>
  <!-- Dents / damage marks -->
  <path d="M230 265 L240 275 L235 268 L245 278" stroke="#ef4444" stroke-width="2"/>
  <circle cx="245" cy="270" r="8" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Wheels -->
  <circle cx="190" cy="305" r="15" fill="#1e293b"/>
  <circle cx="240" cy="305" r="15" fill="#1e293b"/>
  <!-- Process arrows -->
  <rect x="50" y="70" width="105" height="35" rx="8" fill="#ef4444"/>
  <text x="102" y="92" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">1. Déclaration</text>
  <rect x="50" y="120" width="105" height="35" rx="8" fill="#f59e0b"/>
  <text x="102" y="142" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">2. Évaluation</text>
  <rect x="50" y="170" width="105" height="35" rx="8" fill="#4f46e5"/>
  <text x="102" y="192" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">3. Devis garage</text>
  <rect x="50" y="220" width="105" height="35" rx="8" fill="#22c55e"/>
  <text x="102" y="242" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">4. Réparation</text>
  <!-- Arrows between steps -->
  <path d="M102 105 L102 120" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="98,118 102,125 106,118" fill="#94a3b8"/>
  <path d="M102 155 L102 170" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="98,168 102,175 106,168" fill="#94a3b8"/>
  <path d="M102 205 L102 220" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="98,218 102,225 106,218" fill="#94a3b8"/>
  <!-- Person inspecting (Black) -->
  <circle cx="380" cy="180" r="22" fill="#6B3F2A"/>
  <path d="M380 160 Q365 156 367 178" stroke="#3D2314" stroke-width="3" fill="none"/>
  <path d="M380 160 Q395 156 393 178" stroke="#3D2314" stroke-width="3" fill="none"/>
  <ellipse cx="374" cy="178" rx="2" ry="2.5" fill="#1e293b"/>
  <ellipse cx="386" cy="178" rx="2" ry="2.5" fill="#1e293b"/>
  <path d="M376 188 Q380 192 384 188" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Body -->
  <rect x="364" y="202" width="32" height="48" rx="8" fill="#ef4444"/>
  <!-- Arms with clipboard -->
  <path d="M364 215 Q345 220 340 230" stroke="#6B3F2A" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M396 215 Q410 225 415 240" stroke="#6B3F2A" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Clipboard in hand -->
  <rect x="325" y="225" width="30" height="38" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="330" y="235" width="20" height="3" rx="1" fill="#94a3b8"/>
  <rect x="330" y="242" width="15" height="3" rx="1" fill="#94a3b8"/>
  <rect x="330" y="249" width="18" height="3" rx="1" fill="#94a3b8"/>
  <!-- Comparison chart -->
  <rect x="370" y="300" width="100" height="55" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="420" y="315" text-anchor="middle" font-size="7" fill="#64748b" font-family="Arial">Estimé vs Réel</text>
  <rect x="385" y="325" width="15" height="20" rx="2" fill="#4f46e5"/>
  <rect x="405" y="320" width="15" height="25" rx="2" fill="#22c55e"/>
  <rect x="425" y="330" width="15" height="15" rx="2" fill="#f59e0b"/>
  <rect x="445" y="328" width="15" height="17" rx="2" fill="#ef4444"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#fef2f2"/></linearGradient>
    <linearGradient id="skin8" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A0663C"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
  </defs>
  <rect width="600" height="450" rx="24" fill="url(#bg8)"/>
  <circle cx="500" cy="50" r="55" fill="#fecaca" opacity="0.2"/>

  <!-- Warning triangle -->
  <g transform="translate(300, 30)">
    <path d="M0 0 L150 260 L-150 260Z" fill="#fef3c7" opacity="0.4"/>
    <path d="M0 20 L130 245 L-130 245Z" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <!-- Exclamation -->
    <rect x="-7" y="80" width="14" height="90" rx="7" fill="#f59e0b"/>
    <circle cy="195" r="10" fill="#f59e0b"/>
  </g>

  <!-- Damaged tricycle -->
  <g transform="translate(230, 280)">
    <rect width="120" height="50" rx="8" fill="#6366f1" opacity="0.55"/>
    <rect x="10" y="6" width="50" height="34" rx="5" fill="#818cf8" opacity="0.6"/>
    <!-- Damage marks -->
    <path d="M85 8 L95 22 L88 14 L100 28" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="15" r="12" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 3"/>
    <!-- Wheels -->
    <circle cx="35" cy="55" r="18" fill="#1e293b"/><circle cx="35" cy="55" r="10" fill="#475569"/>
    <circle cx="95" cy="55" r="18" fill="#1e293b"/><circle cx="95" cy="55" r="10" fill="#475569"/>
  </g>

  <!-- Process steps -->
  <g transform="translate(45, 55)">
    <rect width="130" height="42" rx="10" fill="#ef4444"/>
    <text x="65" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">1. Declaration</text>
  </g>
  <g transform="translate(45, 110)">
    <rect width="130" height="42" rx="10" fill="#f59e0b"/>
    <text x="65" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">2. Evaluation</text>
  </g>
  <g transform="translate(45, 165)">
    <rect width="130" height="42" rx="10" fill="#4f46e5"/>
    <text x="65" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">3. Devis garage</text>
  </g>
  <g transform="translate(45, 220)">
    <rect width="130" height="42" rx="10" fill="#22c55e"/>
    <text x="65" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">4. Reparation</text>
  </g>

  <!-- Arrows between steps -->
  <path d="M110 97 L110 110" stroke="#94a3b8" stroke-width="3"/><polygon points="105,108 110,116 115,108" fill="#94a3b8"/>
  <path d="M110 152 L110 165" stroke="#94a3b8" stroke-width="3"/><polygon points="105,163 110,171 115,163" fill="#94a3b8"/>
  <path d="M110 207 L110 220" stroke="#94a3b8" stroke-width="3"/><polygon points="105,218 110,226 115,218" fill="#94a3b8"/>

  <!-- Inspector person (Black) -->
  <g transform="translate(490, 165)">
    <circle cx="0" cy="0" r="30" fill="url(#skin8)"/>
    <path d="M-25 -11 Q-16 -38 0 -40 Q16 -38 25 -11" fill="#2C1006"/>
    <ellipse cx="-10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <ellipse cx="10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <circle cx="-9" cy="-1.5" r="1.6" fill="#fff"/>
    <circle cx="11" cy="-1.5" r="1.6" fill="#fff"/>
    <path d="M-7 14 Q0 20 7 14" stroke="#2C1006" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-22" y="32" width="44" height="60" rx="10" fill="#ef4444"/>
    <!-- Arms with clipboard -->
    <path d="M-22 45 Q-48 50 -52 70" stroke="url(#skin8)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M22 45 Q44 58 42 80" stroke="url(#skin8)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="-14" y="90" width="11" height="45" rx="5" fill="#1e293b"/>
    <rect x="3" y="90" width="11" height="45" rx="5" fill="#1e293b"/>
  </g>

  <!-- Clipboard in hand -->
  <g transform="translate(420, 220)">
    <rect width="42" height="55" rx="5" fill="#fff" stroke="#1e293b" stroke-width="2"/>
    <rect x="6" y="10" width="30" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="6" y="20" width="22" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="6" y="30" width="26" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="6" y="40" width="18" height="5" rx="2.5" fill="#94a3b8"/>
  </g>

  <!-- Comparison chart -->
  <g transform="translate(410, 350)">
    <rect width="150" height="75" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b" font-family="sans-serif">Estime vs Reel</text>
    <rect x="15" y="30" width="22" height="32" rx="4" fill="#4f46e5"/>
    <rect x="43" y="25" width="22" height="37" rx="4" fill="#22c55e"/>
    <rect x="71" y="35" width="22" height="27" rx="4" fill="#f59e0b"/>
    <rect x="99" y="33" width="22" height="29" rx="4" fill="#ef4444"/>
    <text x="26" y="76" text-anchor="middle" font-size="7" fill="#64748b" font-family="sans-serif">Est.</text>
    <text x="54" y="76" text-anchor="middle" font-size="7" fill="#64748b" font-family="sans-serif">Reel</text>
  </g>
</svg>


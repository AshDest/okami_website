<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A0663C"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
    <linearGradient id="gpsGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="600" height="450" rx="24" fill="url(#bg1)"/>
  <!-- Decorative blobs -->
  <circle cx="520" cy="80" r="90" fill="#c7d2fe" opacity="0.2"/>
  <circle cx="70" cy="380" r="60" fill="#ddd6fe" opacity="0.18"/>
  <circle cx="300" cy="30" r="40" fill="#fef3c7" opacity="0.3"/>

  <!-- Map background -->
  <rect x="40" y="60" width="520" height="330" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Grid lines (map roads) -->
  <line x1="40" y1="160" x2="560" y2="160" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="40" y1="240" x2="560" y2="240" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="40" y1="320" x2="560" y2="320" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="160" y1="60" x2="160" y2="390" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="300" y1="60" x2="300" y2="390" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="440" y1="60" x2="440" y2="390" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Roads on map -->
  <rect x="100" y="150" width="400" height="20" rx="4" fill="#e2e8f0"/>
  <rect x="200" y="100" width="18" height="250" rx="4" fill="#e2e8f0"/>
  <rect x="380" y="80" width="18" height="280" rx="4" fill="#e2e8f0"/>
  <rect x="80" y="280" width="430" height="18" rx="4" fill="#e2e8f0"/>

  <!-- Tricycle 1 on map (tracked) -->
  <g transform="translate(140, 120)">
    <rect x="-20" y="-8" width="40" height="22" rx="6" fill="#4f46e5"/>
    <circle cx="-12" cy="16" r="7" fill="#1e293b"/><circle cx="-12" cy="16" r="3.5" fill="#475569"/>
    <circle cx="12" cy="16" r="7" fill="#1e293b"/><circle cx="12" cy="16" r="3.5" fill="#475569"/>
    <!-- GPS signal -->
    <circle cx="0" cy="-18" r="4" fill="#22c55e"/>
    <circle cx="0" cy="-18" r="10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="-18" r="18" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Tricycle 2 on map (tracked) -->
  <g transform="translate(350, 265)">
    <rect x="-20" y="-8" width="40" height="22" rx="6" fill="#7c3aed"/>
    <circle cx="-12" cy="16" r="7" fill="#1e293b"/><circle cx="-12" cy="16" r="3.5" fill="#475569"/>
    <circle cx="12" cy="16" r="7" fill="#1e293b"/><circle cx="12" cy="16" r="3.5" fill="#475569"/>
    <!-- GPS signal -->
    <circle cx="0" cy="-18" r="4" fill="#22c55e"/>
    <circle cx="0" cy="-18" r="10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="-18" r="18" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Tricycle 3 on map (tracked) -->
  <g transform="translate(470, 145)">
    <rect x="-20" y="-8" width="40" height="22" rx="6" fill="#f59e0b"/>
    <circle cx="-12" cy="16" r="7" fill="#1e293b"/><circle cx="-12" cy="16" r="3.5" fill="#475569"/>
    <circle cx="12" cy="16" r="7" fill="#1e293b"/><circle cx="12" cy="16" r="3.5" fill="#475569"/>
    <!-- GPS signal -->
    <circle cx="0" cy="-18" r="4" fill="#22c55e"/>
    <circle cx="0" cy="-18" r="10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="-18" r="18" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Route trail (dashed line) -->
  <path d="M140 135 C180 135 180 160 210 160 S260 160 280 180 S320 250 350 265" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.5"/>
  <path d="M350 265 C400 265 420 200 470 160" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.4"/>

  <!-- Big GPS Pin (central) -->
  <g transform="translate(300, 200)">
    <ellipse cx="0" cy="45" rx="18" ry="5" fill="#4f46e5" opacity="0.15"/>
    <path d="M0 -40 C-22 -40 -35 -22 -35 -5 C-35 18 0 45 0 45 C0 45 35 18 35 -5 C35 -22 22 -40 0 -40Z" fill="url(#gpsGrad)"/>
    <circle cx="0" cy="-8" r="14" fill="#fff"/>
    <circle cx="0" cy="-8" r="6" fill="#4f46e5"/>
  </g>

  <!-- Speed indicator panel -->
  <g transform="translate(420, 60)">
    <rect width="135" height="85" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/>
    <text x="12" y="24" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#4f46e5">VITESSE</text>
    <text x="12" y="52" font-family="Inter,sans-serif" font-size="24" font-weight="800" fill="#1e293b">38</text>
    <text x="55" y="52" font-family="Inter,sans-serif" font-size="12" fill="#64748b">km/h</text>
    <rect x="12" y="62" width="110" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="12" y="62" width="55" height="6" rx="3" fill="#22c55e"/>
  </g>

  <!-- Position info panel -->
  <g transform="translate(45, 60)">
    <rect width="145" height="85" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/>
    <text x="12" y="24" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#7c3aed">POSITION GPS</text>
    <circle cx="120" cy="18" r="6" fill="#22c55e"/>
    <circle cx="120" cy="18" r="10" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <text x="12" y="45" font-family="Inter,sans-serif" font-size="10" fill="#334155">Lat: -4.3250° S</text>
    <text x="12" y="62" font-family="Inter,sans-serif" font-size="10" fill="#334155">Lng: 15.3222° E</text>
    <text x="12" y="78" font-family="Inter,sans-serif" font-size="9" fill="#22c55e" font-weight="600">● En ligne — Kinshasa</text>
  </g>

  <!-- Security shield badge -->
  <g transform="translate(260, 340)">
    <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#4f46e5"/>
    <path d="M-12 -6 L-12 4 C-12 10 0 16 0 16 C0 16 12 10 12 4 L12 -6Z" fill="#fff"/>
    <path d="M-4 1 L-1 4 L6 -3" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="5" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#fff">GPS</text>
  </g>
</svg>


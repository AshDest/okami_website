<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="skin7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A0663C"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
  </defs>
  <rect width="600" height="450" rx="24" fill="url(#bg7)"/>
  <circle cx="90" cy="60" r="50" fill="#c7d2fe" opacity="0.2"/>

  <!-- Workshop building -->
  <rect x="100" y="140" width="400" height="240" rx="0" fill="#f1f5f9"/>
  <rect x="100" y="115" width="400" height="30" rx="0" fill="#4f46e5"/>
  <text x="300" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="sans-serif">ATELIER OKAMI</text>
  <!-- Roof -->
  <path d="M80 115 L300 55 L520 115Z" fill="#3730a3"/>

  <!-- Tricycle on lift -->
  <g transform="translate(240, 240)">
    <rect width="160" height="60" rx="10" fill="#6366f1" opacity="0.7"/>
    <rect x="10" y="10" width="70" height="38" rx="6" fill="#818cf8"/>
    <rect x="90" y="0" width="60" height="60" rx="6" fill="#4f46e5"/>
    <rect x="98" y="12" width="44" height="30" rx="4" fill="#a5b4fc" opacity="0.4"/>
    <!-- Wheels up -->
    <circle cx="45" cy="70" r="22" fill="#1e293b"/><circle cx="45" cy="70" r="12" fill="#475569"/>
    <circle cx="130" cy="70" r="22" fill="#1e293b"/><circle cx="130" cy="70" r="12" fill="#475569"/>
  </g>

  <!-- Lift platform -->
  <rect x="220" y="330" width="200" height="10" rx="3" fill="#94a3b8"/>
  <rect x="305" y="340" width="30" height="30" fill="#64748b"/>

  <!-- Tools on wall -->
  <g transform="translate(120, 165)">
    <rect width="10" height="50" rx="3" fill="#94a3b8"/>
    <circle cx="5" cy="-8" r="12" fill="none" stroke="#94a3b8" stroke-width="5"/>
    <rect x="25" y="8" width="30" height="8" rx="3" fill="#f59e0b"/>
    <rect x="25" y="22" width="24" height="8" rx="3" fill="#f59e0b"/>
    <rect x="25" y="36" width="28" height="8" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Checklist on wall -->
  <g transform="translate(430, 155)">
    <rect width="55" height="75" rx="5" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
    <g transform="translate(10, 14)">
      <path d="M0 0 L5 5 L14 -4" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="20" y="-2" width="18" height="6" rx="3" fill="#c7d2fe"/>
    </g>
    <g transform="translate(10, 32)">
      <path d="M0 0 L5 5 L14 -4" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="20" y="-2" width="18" height="6" rx="3" fill="#c7d2fe"/>
    </g>
    <g transform="translate(10, 50)">
      <path d="M0 0 L5 5 L14 -4" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="20" y="-2" width="18" height="6" rx="3" fill="#c7d2fe"/>
    </g>
  </g>

  <!-- Mechanic (Black person) -->
  <g transform="translate(175, 220)">
    <circle cx="0" cy="0" r="28" fill="url(#skin7)"/>
    <path d="M-23 -10 Q-14 -35 0 -37 Q14 -35 23 -10" fill="#2C1006"/>
    <!-- Hard hat -->
    <ellipse cx="0" cy="-15" rx="28" ry="10" fill="#f59e0b"/>
    <rect x="-28" y="-22" width="56" height="10" rx="5" fill="#f59e0b"/>
    <!-- Face -->
    <ellipse cx="-9" cy="0" rx="3.5" ry="4" fill="#1e293b"/>
    <ellipse cx="9" cy="0" rx="3.5" ry="4" fill="#1e293b"/>
    <circle cx="-8" cy="-1.5" r="1.4" fill="#fff"/>
    <circle cx="10" cy="-1.5" r="1.4" fill="#fff"/>
    <path d="M-7 12 Q0 19 7 12" stroke="#2C1006" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Body (blue coveralls) -->
    <rect x="-22" y="30" width="44" height="60" rx="10" fill="#3730a3"/>
    <rect x="-5" y="30" width="10" height="60" fill="#4f46e5"/>
    <!-- Arms working -->
    <path d="M22 42 Q48 35 58 50" stroke="url(#skin7)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M-22 42 Q-42 50 -38 70" stroke="url(#skin7)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="-15" y="88" width="11" height="42" rx="5" fill="#1e293b"/>
    <rect x="4" y="88" width="11" height="42" rx="5" fill="#1e293b"/>
  </g>

  <!-- Calendar / Planning -->
  <g transform="translate(80, 35)">
    <rect width="120" height="72" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="2.5"/>
    <rect y="0" width="120" height="22" rx="10" fill="#4f46e5"/>
    <rect y="14" width="120" height="8" fill="#4f46e5"/>
    <text x="60" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="sans-serif">PLANNING</text>
    <rect x="10" y="30" width="16" height="12" rx="3" fill="#22c55e"/>
    <rect x="32" y="30" width="16" height="12" rx="3" fill="#f59e0b"/>
    <rect x="54" y="30" width="16" height="12" rx="3" fill="#22c55e"/>
    <rect x="76" y="30" width="16" height="12" rx="3" fill="#ef4444"/>
    <rect x="98" y="30" width="12" height="12" rx="3" fill="#22c55e"/>
    <rect x="10" y="48" width="16" height="12" rx="3" fill="#22c55e"/>
    <rect x="32" y="48" width="16" height="12" rx="3" fill="#22c55e"/>
    <rect x="54" y="48" width="16" height="12" rx="3" fill="#f59e0b"/>
    <rect x="76" y="48" width="16" height="12" rx="3" fill="#22c55e"/>
    <rect x="98" y="48" width="12" height="12" rx="3" fill="#22c55e"/>
  </g>

  <!-- Gear icon -->
  <g transform="translate(490, 55)">
    <circle r="28" fill="none" stroke="#4f46e5" stroke-width="5"/>
    <circle r="12" fill="#4f46e5"/>
    <rect x="-5" y="-38" width="10" height="14" rx="3" fill="#4f46e5"/>
    <rect x="-5" y="24" width="10" height="14" rx="3" fill="#4f46e5"/>
    <rect x="-38" y="-5" width="14" height="10" rx="3" fill="#4f46e5"/>
    <rect x="24" y="-5" width="14" height="10" rx="3" fill="#4f46e5"/>
  </g>
</svg>


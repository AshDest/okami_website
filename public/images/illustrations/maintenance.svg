<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <rect width="500" height="400" rx="20" fill="#eef2ff"/>
  <!-- Garage/Workshop -->
  <rect x="80" y="150" width="340" height="180" rx="5" fill="#f1f5f9"/>
  <rect x="80" y="130" width="340" height="25" fill="#4f46e5"/>
  <text x="250" y="147" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial" font-weight="bold">ATELIER OKAMI</text>
  <!-- Tricycle on lift -->
  <rect x="180" y="230" width="140" height="50" rx="8" fill="#6366f1" opacity="0.7"/>
  <rect x="190" y="240" width="60" height="30" rx="5" fill="#818cf8"/>
  <!-- Wheels (up on lift) -->
  <circle cx="210" cy="290" r="18" fill="#1e293b"/>
  <circle cx="210" cy="290" r="9" fill="#475569"/>
  <circle cx="300" cy="290" r="18" fill="#1e293b"/>
  <circle cx="300" cy="290" r="9" fill="#475569"/>
  <!-- Lift platform -->
  <rect x="160" y="310" width="180" height="8" rx="2" fill="#94a3b8"/>
  <rect x="230" y="318" width="40" height="12" fill="#64748b"/>
  <!-- Tools on wall -->
  <rect x="100" y="165" width="8" height="40" rx="2" fill="#94a3b8"/>
  <circle cx="104" cy="160" r="10" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="130" y="170" width="25" height="6" rx="2" fill="#f59e0b"/>
  <rect x="130" y="182" width="20" height="6" rx="2" fill="#f59e0b"/>
  <!-- Checklist -->
  <rect x="370" y="165" width="40" height="55" rx="3" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
  <path d="M378 178 L382 182 L390 174" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M378 190 L382 194 L390 186" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M378 202 L382 206 L390 198" stroke="#22c55e" stroke-width="2" fill="none"/>
  <!-- Mechanic (Black person) -->
  <circle cx="140" cy="230" r="22" fill="#6B3F2A"/>
  <path d="M140 210 Q125 206 127 228" stroke="#3D2314" stroke-width="3" fill="none"/>
  <path d="M140 210 Q155 206 153 228" stroke="#3D2314" stroke-width="3" fill="none"/>
  <!-- Hard hat -->
  <ellipse cx="140" cy="212" rx="22" ry="8" fill="#f59e0b"/>
  <rect x="120" y="205" width="40" height="8" rx="4" fill="#f59e0b"/>
  <ellipse cx="134" cy="228" rx="2" ry="2.5" fill="#1e293b"/>
  <ellipse cx="146" cy="228" rx="2" ry="2.5" fill="#1e293b"/>
  <path d="M136 237 Q140 242 144 237" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Body with coveralls -->
  <rect x="124" y="252" width="32" height="48" rx="8" fill="#3730a3"/>
  <rect x="136" y="252" width="8" height="48" fill="#4f46e5"/>
  <!-- Arms working on vehicle -->
  <path d="M156 265 Q175 255 185 250" stroke="#6B3F2A" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M124 265 Q110 275 105 290" stroke="#6B3F2A" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Calendar / Planning -->
  <rect x="80" y="60" width="100" height="60" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="80" y="60" width="100" height="18" rx="8" fill="#4f46e5"/>
  <text x="130" y="73" text-anchor="middle" font-size="8" fill="#fff" font-family="Arial" font-weight="bold">PLANNING</text>
  <rect x="90" y="85" width="12" height="8" rx="2" fill="#22c55e"/>
  <rect x="108" y="85" width="12" height="8" rx="2" fill="#f59e0b"/>
  <rect x="126" y="85" width="12" height="8" rx="2" fill="#22c55e"/>
  <rect x="144" y="85" width="12" height="8" rx="2" fill="#ef4444"/>
  <rect x="90" y="100" width="12" height="8" rx="2" fill="#22c55e"/>
  <rect x="108" y="100" width="12" height="8" rx="2" fill="#22c55e"/>
  <rect x="126" y="100" width="12" height="8" rx="2" fill="#f59e0b"/>
  <rect x="144" y="100" width="12" height="8" rx="2" fill="#22c55e"/>
  <!-- Gear icon -->
  <circle cx="400" cy="80" r="25" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <circle cx="400" cy="80" r="10" fill="#4f46e5"/>
  <rect x="396" y="52" width="8" height="12" rx="2" fill="#4f46e5"/>
  <rect x="396" y="96" width="8" height="12" rx="2" fill="#4f46e5"/>
  <rect x="372" y="76" width="12" height="8" rx="2" fill="#4f46e5"/>
  <rect x="416" y="76" width="12" height="8" rx="2" fill="#4f46e5"/>
</svg>


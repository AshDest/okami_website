<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="skin4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A0663C"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#fff"/></linearGradient>
  </defs>
  <rect width="600" height="450" rx="24" fill="url(#bg4)"/>
  <circle cx="530" cy="70" r="70" fill="#ddd6fe" opacity="0.25"/>

  <!-- Laptop -->
  <g transform="translate(130, 120)">
    <!-- Screen frame -->
    <rect width="340" height="210" rx="14" fill="#1e293b"/>
    <rect x="10" y="10" width="320" height="185" rx="6" fill="url(#screen)"/>
    <!-- Top bar -->
    <rect x="20" y="20" width="100" height="16" rx="5" fill="#4f46e5"/>
    <text x="70" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="sans-serif">Tricycle App</text>
    <circle cx="290" cy="28" r="5" fill="#22c55e"/><circle cx="305" cy="28" r="5" fill="#f59e0b"/><circle cx="320" cy="28" r="5" fill="#ef4444"/>
    <!-- Chart bars -->
    <rect x="25" y="145" width="22" height="40" rx="4" fill="#4f46e5"/>
    <rect x="55" y="125" width="22" height="60" rx="4" fill="#7c3aed"/>
    <rect x="85" y="110" width="22" height="75" rx="4" fill="#4f46e5"/>
    <rect x="115" y="95" width="22" height="90" rx="4" fill="#7c3aed"/>
    <rect x="145" y="120" width="22" height="65" rx="4" fill="#4f46e5"/>
    <rect x="175" y="105" width="22" height="80" rx="4" fill="#22c55e"/>
    <!-- Stats cards -->
    <rect x="210" y="50" width="110" height="42" rx="8" fill="#eef2ff"/>
    <text x="265" y="68" text-anchor="middle" font-size="8" fill="#64748b" font-family="sans-serif">Motos gerees</text>
    <text x="265" y="84" text-anchor="middle" font-size="16" font-weight="800" fill="#4f46e5" font-family="sans-serif">200+</text>
    <rect x="210" y="100" width="110" height="42" rx="8" fill="#f0fdf4"/>
    <text x="265" y="118" text-anchor="middle" font-size="8" fill="#64748b" font-family="sans-serif">Collecte du jour</text>
    <text x="265" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#22c55e" font-family="sans-serif">1,5M FC</text>
    <rect x="210" y="150" width="110" height="35" rx="8" fill="#fef3c7"/>
    <text x="265" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309" font-family="sans-serif">Temps reel</text>
    <!-- Laptop base -->
    <path d="M-20 210 L360 210 L380 240 L-40 240Z" fill="#334155" />
    <rect x="-40" y="238" width="420" height="6" rx="3" fill="#1e293b"/>
  </g>

  <!-- Person using laptop (Black) -->
  <g transform="translate(300, 55)">
    <circle cx="0" cy="0" r="32" fill="url(#skin4)"/>
    <path d="M-27 -12 Q-16 -40 0 -42 Q16 -40 27 -12" fill="#2C1006"/>
    <ellipse cx="-10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <ellipse cx="10" cy="0" rx="4" ry="4.5" fill="#1e293b"/>
    <circle cx="-9" cy="-1.5" r="1.6" fill="#fff"/>
    <circle cx="11" cy="-1.5" r="1.6" fill="#fff"/>
    <path d="M-8 15 Q0 22 8 15" stroke="#2C1006" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Shoulders -->
    <rect x="-22" y="34" width="44" height="26" rx="12" fill="#4f46e5"/>
  </g>

  <!-- Notification bell -->
  <g transform="translate(510, 110)">
    <circle r="32" fill="#f59e0b" opacity="0.15"/>
    <path d="M0-18 Q0-28-10-28 L10-28 Q0-28 0-18 L0 5 L-15 14 L15 14 L0 5Z" fill="#f59e0b"/>
    <circle cy="17" r="4" fill="#f59e0b"/>
    <!-- Badge -->
    <circle cx="12" cy="-22" r="10" fill="#ef4444"/>
    <text x="12" y="-18" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="sans-serif">3</text>
  </g>

  <!-- WiFi signal -->
  <g transform="translate(60, 170)" stroke="#22c55e" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M0 20 Q0 0 20 0" opacity="0.3"/>
    <path d="M0 14 Q0 0 14 0" opacity="0.6"/>
    <path d="M0 8 Q0 0 8 0"/>
    <circle cx="0" cy="22" r="3" fill="#22c55e"/>
  </g>

  <!-- Data particles -->
  <circle cx="90" cy="400" r="6" fill="#4f46e5" opacity="0.4"/>
  <circle cx="130" cy="420" r="4" fill="#7c3aed" opacity="0.3"/>
  <circle cx="480" cy="395" r="7" fill="#f59e0b" opacity="0.4"/>
  <circle cx="520" cy="420" r="4" fill="#22c55e" opacity="0.3"/>
</svg>


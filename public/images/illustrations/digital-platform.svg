<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <rect width="500" height="400" rx="20" fill="#eef2ff"/>
  <!-- Laptop -->
  <rect x="120" y="100" width="260" height="170" rx="10" fill="#1e293b"/>
  <rect x="130" y="110" width="240" height="145" rx="4" fill="#fff"/>
  <!-- Screen - Dashboard -->
  <rect x="140" y="120" width="80" height="12" rx="3" fill="#4f46e5"/>
  <text x="180" y="130" text-anchor="middle" font-size="8" fill="#fff" font-family="Arial" font-weight="bold">Tricycle App</text>
  <!-- Chart bars -->
  <rect x="145" y="200" width="15" height="40" rx="2" fill="#4f46e5"/>
  <rect x="165" y="185" width="15" height="55" rx="2" fill="#7c3aed"/>
  <rect x="185" y="175" width="15" height="65" rx="2" fill="#4f46e5"/>
  <rect x="205" y="165" width="15" height="75" rx="2" fill="#7c3aed"/>
  <rect x="225" y="190" width="15" height="50" rx="2" fill="#4f46e5"/>
  <!-- Stats cards on screen -->
  <rect x="260" y="140" width="95" height="35" rx="5" fill="#eef2ff"/>
  <text x="307" y="155" text-anchor="middle" font-size="7" fill="#64748b" font-family="Arial">Motos gérées</text>
  <text x="307" y="168" text-anchor="middle" font-size="12" fill="#4f46e5" font-family="Arial" font-weight="bold">200+</text>
  <rect x="260" y="180" width="95" height="35" rx="5" fill="#f0fdf4"/>
  <text x="307" y="195" text-anchor="middle" font-size="7" fill="#64748b" font-family="Arial">Collecté aujourd'hui</text>
  <text x="307" y="208" text-anchor="middle" font-size="10" fill="#22c55e" font-family="Arial" font-weight="bold">1.5M FC</text>
  <rect x="260" y="220" width="95" height="28" rx="5" fill="#fefce8"/>
  <text x="307" y="238" text-anchor="middle" font-size="8" fill="#d97706" font-family="Arial" font-weight="bold">⚡ Temps réel</text>
  <!-- Laptop base -->
  <path d="M100 270 L400 270 L420 290 L80 290 Z" fill="#334155"/>
  <!-- Notification bell -->
  <circle cx="420" cy="120" r="25" fill="#f59e0b" opacity="0.2"/>
  <path d="M420 108 Q420 100 412 100 L428 100 Q420 100 420 108 L420 125 L408 132 L432 132 L420 125 Z" fill="#f59e0b"/>
  <circle cx="420" cy="135" r="3" fill="#f59e0b"/>
  <circle cx="432" cy="105" r="8" fill="#ef4444"/>
  <text x="432" y="109" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">3</text>
  <!-- Person using laptop (Black) -->
  <circle cx="250" cy="55" r="25" fill="#6B3F2A"/>
  <path d="M250 33 Q232 28 234 52" stroke="#3D2314" stroke-width="3" fill="none"/>
  <path d="M250 33 Q268 28 266 52" stroke="#3D2314" stroke-width="3" fill="none"/>
  <ellipse cx="243" cy="53" rx="2.5" ry="2.5" fill="#1e293b"/>
  <ellipse cx="257" cy="53" rx="2.5" ry="2.5" fill="#1e293b"/>
  <path d="M245 63 Q250 68 255 63" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Shoulders -->
  <rect x="234" y="80" width="32" height="20" rx="8" fill="#4f46e5"/>
  <!-- WiFi signal -->
  <path d="M65 130 Q65 100 95 100" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M65 140 Q65 100 105 100" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M65 150 Q65 100 115 100" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Data flow particles -->
  <circle cx="80" cy="320" r="4" fill="#4f46e5" opacity="0.5"/>
  <circle cx="120" cy="340" r="3" fill="#7c3aed" opacity="0.4"/>
  <circle cx="380" cy="320" r="5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="350" cy="350" r="3" fill="#22c55e" opacity="0.4"/>
</svg>

